name: create-release
on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v4.8.0

concurrency:
  # Queue same-tag runs, never preempt them. A cancel can land between Create
  # Release and Update Major Version Tag, leaving a published release with the
  # major tag still pointing at the previous one. Nothing is gained by
  # cancelling either: a run whose tag moved underneath it already fails at the
  # ls-remote checks below.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-dist:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # was: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # was: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # test/dist.test.mjs rebuilds the bundle with ncc and compares it to the
      # checked-in dist/, checks that changelog.sh matches its source, and
      # asserts the exec bit -- everything the attestation depends on. Run the
      # whole suite rather than restating those checks here: it is one copy of
      # the logic, and it also means no release ships on a red suite.
      - name: Verify the bundle and the release workflow
        run: npm test

  release:
    needs: verify-dist
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      # To use this repository's private action, you must check out the repository
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # was: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Generate changelog
        id: changelog
        uses: ./
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify attestation subject is unchanged
        run: git diff --exit-code "$GITHUB_SHA" -- dist/index.js dist/changelog.sh
      - name: Verify release tag still targets this commit
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          remote_sha=$(git ls-remote origin \
            "refs/tags/$TAG_NAME" "refs/tags/$TAG_NAME^{}" | \
            LC_ALL=C awk '
              $2 ~ /\^\{\}$/ { peeled = $1 }
              $2 !~ /\^\{\}$/ { direct = $1 }
              END { print peeled ? peeled : direct }
            ')
          test "$remote_sha" = "$GITHUB_SHA"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # was: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/index.js'
      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # was: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          # Only consulted if the tag has to be created, which a push-triggered
          # run never needs. The binding to this commit is enforced by the
          # ls-remote checks above and below, not by this input.
          commit: ${{ github.sha }}
          immutableCreate: true
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published tag still targets this commit
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          remote_sha=$(git ls-remote origin \
            "refs/tags/$TAG_NAME" "refs/tags/$TAG_NAME^{}" | \
            LC_ALL=C awk '
              $2 ~ /\^\{\}$/ { peeled = $1 }
              $2 !~ /\^\{\}$/ { direct = $1 }
              END { print peeled ? peeled : direct }
            ')
          test "$remote_sha" = "$GITHUB_SHA"
      - name: Update Major Version Tag
        # The push deliberately uses the credential actions/checkout persisted,
        # which is the default GITHUB_TOKEN. Pushes made with it do not trigger
        # workflows. A PAT here would re-trigger this workflow on the v4 tag,
        # which matches the v* filter, and each run would push v4 again.
        run: |
          MAJOR_VERSION=$(printf '%s\n' "$TAG_NAME" | grep -oE 'v[0-9]+')
          git tag -f "$MAJOR_VERSION"
          git push origin "$MAJOR_VERSION" --force
        env:
          TAG_NAME: ${{ github.ref_name }}
